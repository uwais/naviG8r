<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account menu</title>
<link rel="stylesheet" href="./nv.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>




<div class="scr">
  <header class="hdr" aria-hidden="true">
    <div class="hdr-who-btn"><span class="hdr-text"><span class="hdr-co">Sharma Textiles</span><span class="hdr-sub">Priya Raman · Shipper</span></span><svg class="hdr-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
  </header>
  <div class="body" aria-hidden="true">
    <p class="h1">Good morning</p>
    <div class="card" style="height: 160px;"></div>
    <div class="card" style="height: 120px;"></div>
  </div>
  <div class="scrim">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh">
      <div class="grab" aria-hidden="true"></div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h2 id="mh" class="sheet-title">Priya Raman</h2>
        <p class="cap tnum">+91 98450 12345</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <p class="label">Your companies</p>
        <div class="choices" role="radiogroup" aria-label="Your companies">
          <label class="choice on"><input type="radio" name="org" checked><span class="choice-text"><span class="h2">Sharma Textiles</span><span class="cap">Shipper</span></span></label>
          <label class="choice"><input type="radio" name="org"><span class="choice-text"><span class="h2">Ravi Roadways</span><span class="cap">Carrier · Dispatcher</span></span></label>
        </div>
      </div>
      <div class="rows">
        <a class="row-link" href="Main.dc.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="grow"><span class="strong">Add a company</span><span class="cap">Register as a carrier, or join one</span></span></a>
        <button class="row-link" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 011 1v14a1 1 0 01-1 1h-4M10 8l-4 4 4 4M6 12h10"/></svg><span class="grow"><span class="strong">Sign out</span></span></button>
      </div>
      <button class="btn btn-secondary btn-full" type="button">Close</button>
    </section>
  </div>
</div>

</body>
</html>
