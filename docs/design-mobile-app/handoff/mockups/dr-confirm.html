<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver: confirm delivery</title>
<link rel="stylesheet" href="./nv.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>




<div class="scr">
  <header class="hdr">
    <a class="hdr-back" href="dr-trip.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Trip</a>
    <span class="hdr-title">Drop 1 of 3</span>
  </header>
  <main class="body" aria-labelledby="h">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 id="h" class="h1">Confirm delivery</h1>
      <p class="lead">Guindy, Chennai · Sharma Textiles · 80 kg</p>
    </div>
    <ol style="display: flex; flex-direction: column; gap: 12px;">
      <li class="card" style="gap: 10px;">
        <p class="h2">1. Photo of the signed delivery note</p>
        <div style="display: flex; gap: 12px; align-items: center;">
          <div style="width: 72px; height: 72px; border-radius: 12px; background: var(--sunken); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex: none;" role="img" aria-label="Photo added: delivery note"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" style="color: var(--slate);" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <p class="strong" style="color: var(--good);">Photo added</p>
            <button class="btn btn-quiet" type="button" style="padding: 0; justify-content: flex-start;">Take again</button>
          </div>
        </div>
      </li>
      <li class="card" style="gap: 10px;">
        <p class="h2">2. Confirm the goods are handed over</p>
        <p class="cap-ink">Sharma Textiles gets the photo as proof of delivery.</p>
      </li>
    </ol>
  </main>
  <div class="actionbar">
    <button class="btn btn-primary btn-full" type="button" style="min-height: 56px; font-size: 16px;">Confirm delivery</button>
  </div>
</div>

</body>
</html>
