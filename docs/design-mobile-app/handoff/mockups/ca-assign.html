<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assign a driver</title>
<link rel="stylesheet" href="./nv.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>




<div class="scr">
  <header class="hdr" aria-hidden="true">
    <span class="hdr-back">Trips</span>
    <div class="hdr-who-btn"><span class="hdr-text"><span class="hdr-co">Ravi Roadways</span><span class="hdr-sub">Ravi Shetty · Owner</span></span></div>
  </header>
  <div class="body" aria-hidden="true">
    <div class="sumcard"><p class="h1">Bengaluru to Chennai</p></div>
  </div>
  <div class="scrim">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="ah" aria-describedby="ad">
      <div class="grab" aria-hidden="true"></div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h2 id="ah" class="sheet-title">Who drives this trip?</h2>
        <p id="ad" class="cap-ink">Bengaluru to Chennai, 18 – 19 Oct, truck <span class="mono" style="font-size: 14px;">KA01AB1234</span>. The driver sees the trip and the e-way bill, never the payment.</p>
      </div>
      <div class="choices" role="radiogroup" aria-labelledby="ah">
        <label class="choice on"><input type="radio" name="drv" checked><span class="choice-text"><span class="strong">Prakash Naidu</span><span class="cap tnum">+91 99001 22334</span></span></label>
        <label class="choice"><input type="radio" name="drv"><span class="choice-text"><span class="strong">Suresh Kumar</span><span class="cap">On the Mysuru trip today</span></span></label>
        <label class="choice"><input type="radio" name="drv"><span class="choice-text"><span class="strong">Ravi Shetty (you)</span><span class="cap">Owner-driver</span></span></label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-primary btn-full" type="button">Assign Prakash Naidu</button>
        <button class="btn btn-secondary btn-full" type="button">Cancel</button>
      </div>
      <a class="btn btn-quiet" href="ca-profile.dc.html" style="align-self: center;">Add a driver to your company</a>
    </section>
  </div>
</div>

</body>
</html>
