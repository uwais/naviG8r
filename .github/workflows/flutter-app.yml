name: Flutter app

# Why this exists: before it, no workflow touched apps/driver_pilot on a pull request.
# docker-image.yml and docker-publish.yml build the API image. release.yml does build the
# Flutter web image, but only on push to main, which is after merge. So a green tick on a
# PR carried no information about the phone app at all, and a broken widget test sat red
# unnoticed until someone read it by hand.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cloned rather than installed through a marketplace action, to match how
      # scripts/render-build-customer-web.sh installs this same pinned version. Keeping one
      # install method means CI and the Render build cannot drift onto different SDKs.
      # Costs about 60s; revisit with a cache only if this job becomes a bottleneck.
      - name: Install Flutter 3.22.3
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.22.3 --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Report versions
        run: flutter --version

      - name: Resolve dependencies
        working-directory: apps/driver_pilot
        run: flutter pub get

      # Errors only, on purpose. main currently carries 19 infos and 9 warnings (unused
      # imports, redundant null assertions), and a gate that is red on the day it lands is a
      # gate everyone learns to ignore. Clear those 28 in their own change, then tighten this
      # to --no-fatal-infos, then to a bare `flutter analyze`.
      - name: Analyze
        working-directory: apps/driver_pilot
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: apps/driver_pilot
        run: flutter test
